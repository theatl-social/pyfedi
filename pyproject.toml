[project]
name = "pyfedi"
version = "1.7.15+peachpie.20260909"
description = "PieFed - A federated discussion and link aggregation platform"
readme = "README.md"
license = { text = "AGPL-3.0" }
requires-python = ">=3.13"
dependencies = [
    "urllib3~=2.7.0",
    "Flask==3.1.3",
    "python-dotenv==1.2.2",
    "flask-wtf==1.2.2",
    "flask-sqlalchemy==3.1.1",
    "flask-migrate~=4.1.0",
    "flask-login==0.6.3",
    "Flask-Limiter[redis]",
    "email-validator==2.0.0",
    "flask-mail~=0.10.0",
    "flask-babel~=4.0.0",
    "flask-bcrypt~=1.0.0",
    "psycopg2-binary",
    "httpx[http2]~=0.28.0",
    "pyjwt==2.8.0",
    "SQLAlchemy-Searchable==2.1.0",
    "SQLAlchemy-Utils==0.41.1",
    "cryptography==48.0.0",
    "Bootstrap-Flask==2.5.0",
    "arrow~=1.4.0",
    "pyld==2.0.4",
    "boto3~=1.39.0",
    "markdown2==2.5.5",
    "beautifulsoup4~=4.15.0",
    "flask-caching~=2.3.0",
    "flask-compress~=1.24",
    "Pillow",
    "pillow-heif",
    "pillow-avif-plugin>=1.5.5",
    "feedgen==0.9.0",
    "celery==5.3.6",
    "redis~=5.2.0",
    "Werkzeug==3.1.8",
    "pytesseract==0.3.13",
    "sentry-sdk==2.27.0",
    "python-slugify==8.0.4",
    "furl==2.1.3",
    "ua-parser[regex]",
    "captcha",
    "stripe~=12.0.0",
    "Authlib~=1.7.0",
    "webauthn~=2.5.0",
    "ldap3~=2.9.0",
    "sqlalchemy~=2.0.0",
    "orjson~=3.11.0",
    "marshmallow~=4.3.0",
    "flask-smorest~=0.46.1",
    "ics~=0.7.0",
    "dateparser~=1.2.0",
    "uvicorn[standard]==0.35.0",
    "asgiref==3.9.1",
    "pygments~=2.20.0",
    "fastapi~=0.118.0",
    "sqlakeyset~=2.0.0",
    "rich",
    "gunicorn",
    "tatsu==5.13.2",
    "pendulum~=3.2.0",
    "py-svg-hush~=0.3.0",
    "fastfeedparser~=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "pytest-cov",
    "ruff",
    "black",
    "isort",
    "mypy",
    "djlint==1.36.1",
    "bandit[toml]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
    "pytest-mock",
    "pytest-cov",
    "ruff",
    "black",
    "isort",
    "mypy",
    "djlint==1.36.1",
    "bandit[toml]",
    "pre-commit>=4.5.1",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
